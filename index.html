<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whiscraft — Protect the Craft</title>
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dsviustds/image/upload/v1777283676/Whiscraft-logo_Logomark-Dark_500x500_pmthhb.png">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --cobalt: #2E5BFF;
            --acid-green: #C1FF00;
            --paper-white: #F9F9F9;
            --black: #000000;
            --gray-500: #6B6B6B;
            --gray-200: #E8E8E8;
            --font-display: 'Cormorant Garamond', serif;
            --font-ui: 'Inter', sans-serif;
        }
        html, body { 
            font-family: var(--font-ui); 
            background: var(--paper-white); 
            color: var(--black); 
            height: 100%;
            -webkit-font-smoothing: antialiased;
        }

        /* Coming Soon Layout */
        .landing-wrap {
            height: 100vh; width: 100vw; position: relative;
            background: linear-gradient(rgba(255,255,255,0.1), rgba(255,255,255,0.1)), 
                        url('https://res.cloudinary.com/dsviustds/image/upload/v1777284354/make_it_more_202604271405_vzrvsi.jpg') no-repeat center center;
            background-size: cover;
            display: flex; flex-direction: column; justify-content: space-between; padding: 60px;
        }
        .landing-logo { height: 32px; width: auto; align-self: flex-start; }
        .hero-container { max-width: 900px; animation: fadeIn 1.5s ease-out; }
        .tagline {
            font-family: var(--font-display);
            font-size: clamp(42px, 6vw, 72px);
            font-weight: 300; letter-spacing: -0.02em; line-height: 1.05;
            margin-bottom: 32px; color: var(--black);
            font-variant-ligatures: common-ligatures;
        }
        .cta-btn {
            background: var(--black); color: white; border: none;
            padding: 16px 42px; font-size: 12px; letter-spacing: 0.15em;
            font-weight: 500; text-transform: uppercase; cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .cta-btn:hover { background: var(--cobalt); transform: translateY(-2px); }

        /* Footer Nav - Highlighted Entrance */
        .footer-nav { display: flex; justify-content: space-between; align-items: center; padding-top: 30px; border-top: 1px solid rgba(0,0,0,0.1); }
        .status-pill { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; display: flex; align-items: center; gap: 10px; font-weight: 600; color: var(--gray-500); }
        .dot { width: 7px; height: 7px; background: var(--acid-green); border-radius: 50%; box-shadow: 0 0 12px var(--acid-green); }
        
        .vault-access { display: flex; align-items: center; gap: 20px; cursor: pointer; text-decoration: none; }
        .vault-access span { 
            font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 600;
            color: var(--cobalt); border-bottom: 2px solid var(--cobalt); padding-bottom: 4px;
            transition: all 0.3s;
        }
        .vault-access:hover span { color: var(--black); border-color: var(--black); }
        .arrow-circle {
            width: 52px; height: 52px; border: 2px solid var(--cobalt); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: var(--cobalt);
            transition: all 0.4s;
        }
        .vault-access:hover .arrow-circle { background: var(--black); border-color: var(--black); color: white; }

        /* Shopping Grid Styles */
        .vault-wrap { padding: 60px; min-height: 100vh; animation: fadeIn 0.8s ease; }
        .vault-header { font-family: var(--font-display); font-size: 64px; font-weight: 300; margin-bottom: 60px; }
        .masonry { columns: 4; column-gap: 30px; }
        @media (max-width: 1100px) { .masonry { columns: 2; } }
        .card { break-inside: avoid; margin-bottom: 40px; cursor: pointer; background: white; transition: all 0.4s; border: 1px solid transparent; }
        .card:hover { border-color: var(--gray-200); padding: 10px; }
        .card img { width: 100%; height: auto; display: block; }
        .card-info { padding: 20px 0; }
        .card-title { font-family: var(--font-display); font-size: 24px; font-style: italic; }

        /* Windowed Product View */
        .modal-overlay { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.4); 
            backdrop-filter: blur(8px); z-index: 1000; 
            display: flex; align-items: center; justify-content: center;
        }
        .modal-window { 
            width: 85vw; height: 85vh; background: white; 
            display: flex; overflow: hidden; position: relative;
            box-shadow: 0 50px 100px rgba(0,0,0,0.3); border-radius: 4px;
        }
        .modal-image-sec { 
            flex: 1.5; overflow-y: auto; background: #fff; padding: 40px;
            display: flex; flex-direction: column; align-items: center; gap: 30px;
            border-right: 1px solid var(--gray-200);
        }
        .modal-image-sec img { 
            width: 100%; max-width: 500px; height: auto; 
            transition: max-width 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .modal-image-sec img.expanded { max-width: 100%; }
        
        .modal-info-sec { width: 420px; padding: 60px 40px; overflow-y: auto; display: flex; flex-direction: column; }
        .expand-toggle { 
            font-size: 10px; letter-spacing: 0.1em; color: var(--gray-500); 
            cursor: pointer; margin-bottom: 20px; text-decoration: underline; 
        }
        .modal-close { position: absolute; top: 20px; right: 20px; cursor: pointer; font-size: 12px; border: none; background: none; z-index: 1001; letter-spacing: 0.1em; font-weight: 600; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

const mockData = [
  {
    id: 1,
    title: "Signature Camo Essential",
    category: "Lifestyle",
    mediaUrl: "https://res.cloudinary.com/dsviustds/image/upload/v1776947518/Side_1_c8qyfs.png", 
    amazonLink: "https://amzn.to/your-short-link", 
    description: "The debut Whiscraft essential. A heavy-weight, breathable cotton blend crafted for the perfect oversized silhouette. Engineered for absolute comfort without compromising the street aesthetic.",
    slides: [
      "https://res.cloudinary.com/dsviustds/image/upload/v1776947518/Side_1_c8qyfs.png",
      "https://res.cloudinary.com/dsviustds/image/upload/v1776947517/Side_2_ftdjr3.png",
      "https://res.cloudinary.com/dsviustds/image/upload/v1776947516/Side_3_lelwzf.png",
      "https://res.cloudinary.com/dsviustds/image/upload/v1776947517/Side_4_yst9el.png",
      "https://res.cloudinary.com/dsviustds/image/upload/v1776947516/Side_5_nhkzqb.png",
      "https://res.cloudinary.com/dsviustds/image/upload/v1776947516/Side_6_qt7tvh.png"
    ]
  }
];

const App = () => {
  const [view, setView] = useState('landing'); 
  const [selectedProduct, setSelectedProduct] = useState(null);
  const [isExpanded, setIsExpanded] = useState(false);

  const LandingPage = () => (
    <div className="landing-wrap">
      <img src="https://res.cloudinary.com/dsviustds/image/upload/v1776948035/Whiscraft-logo_logo-Dark_1035x267_xanion.png" className="landing-logo" alt="Whiscraft" />
      
      <div className="hero-container">
        <h1 className="tagline">Whiscraft is coming to protect the craft.</h1>
        <button className="cta-btn" onClick={() => setView('account')}>Secure My Spot</button>
      </div>

      <div className="footer-nav">
        <div className="status-pill"><div className="dot"></div> Encryption Protocols Active</div>
        <div className="vault-access" onClick={() => setView('vault')}>
          <span>Explore Curated Vault</span>
          <div className="arrow-circle">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
          </div>
        </div>
      </div>
    </div>
  );

  const VaultPage = () => (
    <div className="vault-wrap">
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom: '60px'}}>
        <img src="https://res.cloudinary.com/dsviustds/image/upload/v1776948035/Whiscraft-logo_logo-Dark_1035x267_xanion.png" height="20" onClick={() => setView('landing')} style={{cursor:'pointer'}} />
        <div style={{display:'flex', gap:'30px'}}>
            <button style={{background:'none', border:'none', cursor:'pointer', fontSize:'10px', letterSpacing:'0.2em', fontWeight:'600'}} onClick={() => setView('account')}>ACCOUNT</button>
            <button style={{background:'none', border:'none', cursor:'pointer', fontSize:'10px', letterSpacing:'0.2em', fontWeight:'600'}} onClick={() => setView('landing')}>CLOSE</button>
        </div>
      </div>
      <h2 className="vault-header">The Curated Vault.</h2>
      <div className="masonry">
        {mockData.map(item => (
          <div key={item.id} className="card" onClick={() => setSelectedProduct(item)}>
            <img src={item.mediaUrl} alt={item.title} />
            <div className="card-info">
              <div className="card-title">{item.title}</div>
              <div style={{fontSize:'10px', color:'var(--gray-500)', marginTop:'8px', textTransform:'uppercase', letterSpacing:'0.1em', fontWeight:'600'}}>{item.category}</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );

  return (
    <div>
      {view === 'landing' && <LandingPage />}
      {view === 'vault' && <VaultPage />}
      {view === 'account' && (
        <div style={{height:'100vh', display:'flex', alignItems:'center', justifyContent:'center'}}>
            <div style={{maxWidth:'360px', width:'100%'}}>
                <h2 style={{fontFamily:'var(--font-display)', fontSize:'42px', marginBottom:'32px'}}>Sign In</h2>
                <input type="email" placeholder="Professional Email" style={{width:'100%', padding:'18px', border:'1px solid #000', marginBottom:'12px', outline:'none', fontSize:'12px'}} />
                <input type="password" placeholder="Password" style={{width:'100%', padding:'18px', border:'1px solid #000', marginBottom:'32px', outline:'none', fontSize:'12px'}} />
                <button className="cta-btn" style={{width:'100%'}} onClick={() => setView('landing')}>Enter Vault</button>
                <p style={{fontSize:'10px', textAlign:'center', marginTop:'20px', color:'#999', cursor:'pointer'}} onClick={() => setView('landing')}>BACK</p>
            </div>
        </div>
      )}

      {selectedProduct && (
        <div className="modal-overlay">
          <div className="modal-window">
            <button className="modal-close" onClick={() => {setSelectedProduct(null); setIsExpanded(false);}}>CLOSE [X]</button>
            <div className="modal-image-sec">
                <span className="expand-toggle" onClick={() => setIsExpanded(!isExpanded)}>
                    {isExpanded ? "[–] REDUCE IMAGE SIZE" : "[+] EXPAND IMAGES"}
                </span>
                {selectedProduct.slides.map((url, i) => (
                    <img key={i} src={url} className={isExpanded ? 'expanded' : ''} alt={`View ${i}`} />
                ))}
            </div>
            <div className="modal-info-sec">
                <span style={{fontSize:'10px', color:'var(--cobalt)', letterSpacing:'0.2em', fontWeight:'700'}}>{selectedProduct.category}</span>
                <h1 style={{fontFamily:'var(--font-display)', fontSize:'48px', margin:'20px 0', fontStyle:'italic'}}>{selectedProduct.title}</h1>
                <p style={{fontSize:'14px', lineHeight:'1.8', color:'var(--gray-500)', marginBottom:'40px'}}>{selectedProduct.description}</p>
                
                <a href={selectedProduct.amazonLink} target="_blank" style={{textDecoration:'none'}}>
                    <button className="cta-btn" style={{width:'100%', marginBottom:'12px'}}>Direct Amazon Link</button>
                </a>
                <button style={{width:'100%', padding:'18px', background:'none', border:'1px solid #000', cursor:'pointer', fontSize:'10px', letterSpacing:'0.2em', fontWeight:'700'}}>ADD TO SHOPPING LIST</button>
                
                <div style={{marginTop:'auto', borderTop:'1px solid var(--gray-200)', paddingTop:'30px'}}>
                    <span style={{fontSize:'10px', fontWeight:'700', letterSpacing:'0.1em'}}>ORGANIZATION</span>
                    <p style={{fontSize:'12px', color:'#999', marginTop:'10px'}}>Save to folders to organize your studio equipment by Project or Client.</p>
                </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
