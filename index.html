<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whiscraft — Protect the Craft</title>
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dsviustds/image/upload/v1777283676/Whiscraft-logo_Logomark-Dark_500x500_pmthhb.png">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --cobalt: #2E5BFF;
            --acid-green: #C1FF00;
            --paper-white: #F9F9F9;
            --black: #000000;
            --gray-500: #6B6B6B;
            --gray-200: #E8E8E8;
            --font-display: 'Cormorant Garamond', serif;
            --font-ui: 'Inter', sans-serif;
        }
        html, body { 
            font-family: var(--font-ui); 
            background: var(--paper-white); 
            color: var(--black); 
            height: 100%;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        .landing-wrap {
            height: 100vh; width: 100vw; position: relative;
            background: url('https://res.cloudinary.com/dsviustds/image/upload/v1777284354/make_it_more_202604271405_vzrvsi.jpg') no-repeat center center;
            background-size: cover;
            display: flex; flex-direction: column; justify-content: space-between; padding: 60px;
        }
        
        .gradient-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 40vh;
            background: linear-gradient(to top, rgba(249, 249, 249, 1) 0%, rgba(249, 249, 249, 0.95) 25%, rgba(249, 249, 249, 0) 100%);
            z-index: 1;
            pointer-events: none;
        }

        .landing-logo { height: 32px; width: auto; align-self: flex-start; z-index: 2; cursor: pointer; }
        
        .hero-container { 
            max-width: 900px; 
            animation: fadeIn 1.5s ease-out; 
            z-index: 2;
            margin-top: -10vh;
        }

        .tagline {
            font-family: var(--font-display);
            font-size: clamp(42px, 6vw, 72px);
            font-weight: 300; letter-spacing: -0.02em; line-height: 1.05;
            margin-bottom: 32px; color: var(--black);
            font-variant-ligatures: common-ligatures;
        }

        .cta-btn {
            background: var(--black); color: white; border: none;
            padding: 18px 42px; font-size: 11px; letter-spacing: 0.15em;
            font-weight: 600; text-transform: uppercase; cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex; align-items: center; justify-content: center;
            text-decoration: none;
        }
        .cta-btn:hover { background: var(--cobalt); transform: translateY(-2px); box-shadow: 0 10px 30px rgba(46, 91, 255, 0.2); }

        .footer-nav { 
            display: flex; justify-content: space-between; align-items: center; 
            padding-top: 30px; z-index: 2; position: relative;
        }

        .status-pill { 
            font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; 
            display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--black);
        }
        .dot { width: 7px; height: 7px; background: var(--acid-green); border-radius: 50%; box-shadow: 0 0 12px var(--acid-green); }
        
        .vault-access { 
            display: flex; align-items: center; gap: 20px; cursor: pointer; text-decoration: none;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 12px 28px;
            border-radius: 100px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .vault-access span { 
            font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 700;
            color: var(--black);
        }

        .arrow-circle {
            width: 40px; height: 40px; background: var(--cobalt); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: white;
            transition: all 0.4s;
        }

        .vault-access:hover { 
            background: #fff; transform: scale(1.05);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1); border-color: var(--cobalt);
        }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(12px); z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .modal-window { 
            width: 80vw; height: 80vh; background: white; display: flex; overflow: hidden; position: relative;
            box-shadow: 0 50px 100px rgba(0,0,0,0.3); border-radius: 8px;
            animation: scaleIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .modal-image-sec { flex: 1.3; overflow-y: auto; background: #fff; padding: 40px; display: flex; flex-direction: column; align-items: center; gap: 30px; border-right: 1px solid var(--gray-200); }
        .modal-image-sec img { width: 100%; max-width: 480px; height: auto; transition: max-width 0.5s ease; border-radius: 4px; }
        .modal-image-sec img.expanded { max-width: 100%; }
        .modal-info-sec { width: 420px; padding: 60px 40px; overflow-y: auto; display: flex; flex-direction: column; }
        
        .vault-wrap { padding: 60px; height: 100vh; overflow-y: auto; background: var(--paper-white); }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

const mockData = [
  {
    id: 1,
    title: "Signature Camo Essential",
    category: "Lifestyle",
    mediaUrl: "https://res.cloudinary.com/dsviustds/image/upload/v1776947518/Side_1_c8qyfs.png", 
    amazonLink: "https://amzn.to/3QSjcmi", 
    description: "The debut Whiscraft essential. A heavy-weight, breathable cotton blend crafted for the perfect oversized silhouette. Engineered for absolute comfort without compromising the street aesthetic.",
    slides: [
      "https://res.cloudinary.com/dsviustds/image/upload/v1776947518/Side_1_c8qyfs.png",
      "https://res.cloudinary.com/dsviustds/image/upload/v1776947517/Side_2_ftdjr3.png",
      "https://res.cloudinary.com/dsviustds/image/upload/v1776947516/Side_3_lelwzf.png",
      "https://res.cloudinary.com/dsviustds/image/upload/v1776947517/Side_4_yst9el.png",
      "https://res.cloudinary.com/dsviustds/image/upload/v1776947516/Side_5_nhkzqb.png",
      "https://res.cloudinary.com/dsviustds/image/upload/v1776947516/Side_6_qt7tvh.png"
    ]
  },
  {
    id: 2,
    title: "Women's Floral Maxi",
    category: "Lifestyle",
    mediaUrl: "https://res.cloudinary.com/dsviustds/image/upload/v1777285800/A_visually_engaging_202604251609_x9idxh.jpg", 
    amazonLink: "https://amzn.to/41WZSqE", 
    description: "The Women's Floral Maxi is a study in fluid elegance. Designed with a deep V-neckline and cascading floral tiers, this piece transitions seamlessly from golden-hour cocktails to late-night soirées. Crafted from a lightweight, breathable weave that moves with you, it’s the ultimate investment for the discerning occasion wardrobe.",
    slides: [
      "https://res.cloudinary.com/dsviustds/image/upload/v1777285800/A_visually_engaging_202604251609_x9idxh.jpg",
      "https://res.cloudinary.com/dsviustds/image/upload/v1777285800/A_bright__airy_202604251609_k52m2c.jpg",
      "https://res.cloudinary.com/dsviustds/image/upload/v1777285801/swap_the_dress_202604251610_oq8jqf.jpg",
      "https://res.cloudinary.com/dsviustds/image/upload/v1777285799/A_high-resolution_photograph_202604251609_1_dshjej.jpg",
      "https://res.cloudinary.com/dsviustds/image/upload/v1777285802/An_extreme_macro-photography_202604251608_qlntzd.jpg"
    ]
  }
];

const App = () => {
  const [view, setView] = useState('landing'); 
  const [selectedProduct, setSelectedProduct] = useState(null);
  const [isExpanded, setIsExpanded] = useState(false);

  const LandingPage = () => (
    <div className="landing-wrap">
      <div className="gradient-overlay"></div>
      <img src="https://res.cloudinary.com/dsviustds/image/upload/v1776948035/Whiscraft-logo_logo-Dark_1035x267_xanion.png" className="landing-logo" alt="Whiscraft Logo" />
      
      <div className="hero-container">
        <h1 className="tagline">We’re putting an eye on your assets. Literally.</h1>
        <button className="cta-btn" onClick={() => setView('account')}>Secure My Spot</button>
      </div>

      <div className="footer-nav">
        <div className="status-pill"><div className="dot"></div> Encryption Protocols Active</div>
        <div className="vault-access" onClick={() => setView('vault')}>
          <span>Explore Curated Vault</span>
          <div className="arrow-circle">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
          </div>
        </div>
      </div>
    </div>
  );

  const VaultPage = () => (
    <div className="vault-wrap">
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom: '80px'}}>
        <img src="https://res.cloudinary.com/dsviustds/image/upload/v1776948035/Whiscraft-logo_logo-Dark_1035x267_xanion.png" height="20" onClick={() => setView('landing')} style={{cursor:'pointer'}} />
        <div style={{display:'flex', gap:'30px'}}>
            <button style={{background:'none', border:'none', cursor:'pointer', fontSize:'11px', letterSpacing:'0.15em', fontWeight:'600'}} onClick={() => setView('account')}>ACCOUNT</button>
            <button style={{background:'none', border:'none', cursor:'pointer', fontSize:'11px', letterSpacing:'0.15em', fontWeight:'600'}} onClick={() => setView('landing')}>EXIT</button>
        </div>
      </div>
      <h2 style={{fontFamily:'var(--font-display)', fontSize:'64px', fontWeight:'300', marginBottom:'60px'}}>The Curated Vault.</h2>
      <div style={{columns: '4', columnGap: '30px'}}>
        {mockData.map(item => (
          <div key={item.id} style={{breakInside:'avoid', marginBottom:'40px', cursor:'pointer'}} onClick={() => setSelectedProduct(item)}>
            <img src={item.mediaUrl} style={{width:'100%', borderRadius:'2px'}} alt={item.title} />
            <div style={{padding:'20px 0', borderBottom:'1px solid var(--gray-200)'}}>
              <div style={{fontFamily:'var(--font-display)', fontSize:'24px', fontStyle:'italic'}}>{item.title}</div>
              <div style={{fontSize:'10px', color:'var(--gray-500)', marginTop:'10px', textTransform:'uppercase', letterSpacing:'0.12em', fontWeight:'600'}}>{item.category}</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );

  return (
    <div>
      {view === 'landing' && <LandingPage />}
      {view === 'vault' && <VaultPage />}
      {view === 'account' && (
        <div style={{height:'100vh', display:'flex', alignItems:'center', justifyContent:'center'}}>
            <div style={{maxWidth:'360px', width:'100%'}}>
                <h2 style={{fontFamily:'var(--font-display)', fontSize:'42px', marginBottom:'32px'}}>Sign In</h2>
                <input type="email" placeholder="Professional Email" style={{width:'100%', padding:'18px', border:'none', borderBottom:'1px solid #000', marginBottom:'16px', outline:'none', fontSize:'13px'}} />
                <input type="password" placeholder="Password" style={{width:'100%', padding:'18px', border:'none', borderBottom:'1px solid #000', marginBottom:'32px', outline:'none', fontSize:'13px'}} />
                <button className="cta-btn" style={{width:'100%'}} onClick={() => setView('landing')}>Enter Vault</button>
                <p style={{fontSize:'11px', textAlign:'center', marginTop:'30px', color:'#999', cursor:'pointer'}} onClick={() => setView('landing')}>BACK TO STEALTH MODE</p>
            </div>
        </div>
      )}

      {selectedProduct && (
        <div className="modal-overlay">
          <div className="modal-window">
            <button style={{position:'absolute', top:'24px', right:'24px', background:'none', border:'none', cursor:'pointer', fontWeight:'700', fontSize:'11px', letterSpacing:'0.1em'}} onClick={() => {setSelectedProduct(null); setIsExpanded(false);}}>CLOSE [X]</button>
            <div className="modal-image-sec">
                <span style={{fontSize:'10px', letterSpacing:'0.15em', cursor:'pointer', textDecoration:'underline', fontWeight:'600'}} onClick={() => setIsExpanded(!isExpanded)}>
                    {isExpanded ? "[–] REDUCE GALLERY SIZE" : "[+] EXPAND GALLERY VIEW"}
                </span>
                {selectedProduct.slides.map((url, i) => (
                    <img key={i} src={url} className={isExpanded ? 'expanded' : ''} alt={`View ${i}`} />
                ))}
            </div>
            <div className="modal-info-sec">
                <span style={{fontSize:'10px', color:'var(--cobalt)', letterSpacing:'0.2em', fontWeight:'700'}}>{selectedProduct.category}</span>
                <h1 style={{fontFamily:'var(--font-display)', fontSize:'48px', margin:'20px 0', fontStyle:'italic', borderBottom:'1px solid #000', paddingBottom:'16px'}}>{selectedProduct.title}</h1>
                <p style={{fontSize:'14px', lineHeight:'1.8', color:'var(--gray-500)', marginBottom:'40px'}}>{selectedProduct.description}</p>
                
                <a href={selectedProduct.amazonLink} target="_blank" className="cta-btn" style={{marginBottom:'16px'}}>
                    Take Me To Product
                </a>
                
                <button style={{width:'100%', padding:'18px', background:'none', border:'1px solid #000', cursor:'pointer', fontSize:'11px', letterSpacing:'0.15em', fontWeight:'700', textTransform:'uppercase'}}>Add to Shopping List</button>
                
                <div style={{marginTop:'auto', borderTop:'1px solid var(--gray-200)', paddingTop:'30px'}}>
                    <span style={{fontSize:'10px', fontWeight:'700', letterSpacing:'0.1em', textTransform:'uppercase'}}>Folder Management</span>
                    <p style={{fontSize:'12px', color:'#999', marginTop:'12px', lineHeight:'1.5'}}>Sign in to organize your curated gear into client-specific project folders.</p>
                </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
