<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whiscraft — Protect the Craft</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --cobalt: #2E5BFF;
            --acid-green: #C1FF00;
            --paper-white: #F9F9F9;
            --black: #000000;
            --gray-500: #6B6B6B;
            --gray-200: #E8E8E8;
            --font-display: 'Cormorant Garamond', serif;
            --font-body: 'DM Sans', sans-serif;
        }
        html, body { 
            font-family: var(--font-body); 
            background: var(--paper-white); 
            color: var(--black); 
            overflow-x: hidden;
            height: 100%;
        }

        /* Coming Soon Styles */
        .landing-wrap {
            height: 100vh;
            width: 100vw;
            position: relative;
            background: url('https://res.cloudinary.com/dsviustds/image/upload/v1777284354/make_it_more_202604271405_vzrvsi.jpg') no-repeat center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
        }
        .landing-logo { height: 32px; width: auto; align-self: flex-start; }
        .hero-container { max-width: 800px; animation: fadeIn 1.2s ease-out; }
        .tagline {
            font-family: var(--font-display);
            font-size: clamp(32px, 4vw, 56px);
            font-weight: 300;
            letter-spacing: -0.01em;
            margin-bottom: 24px;
            color: var(--black);
        }
        .cta-btn {
            background: var(--cobalt);
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 14px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .cta-btn:hover { transform: scale(1.05); background: #1A46E6; }

        /* Footer Nav */
        .footer-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(0,0,0,0.1);
            padding-top: 20px;
        }
        .status-pill { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; display: flex; align-items: center; gap: 8px; }
        .dot { width: 8px; height: 8px; background: var(--acid-green); border-radius: 50%; box-shadow: 0 0 10px var(--acid-green); }
        .arrow-circle {
            width: 44px; height: 44px; border: 1px solid var(--black); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: all 0.3s;
        }
        .arrow-circle:hover { background: var(--black); color: white; }

        /* Vault / Shopping Grid Styles */
        .vault-wrap { padding: 40px; min-height: 100vh; }
        .masonry { columns: 4; column-gap: 20px; }
        @media (max-width: 1000px) { .masonry { columns: 2; } }
        .card { break-inside: avoid; margin-bottom: 24px; cursor: pointer; border: 1px solid var(--gray-200); background: white; padding: 10px; }
        .card img { width: 100%; height: auto; display: block; }
        .card-info { padding: 12px 0; }
        .card-title { font-size: 14px; font-weight: 500; }
        
        /* Modal Styles */
        .modal-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.98); z-index: 1000; display: flex; padding: 40px; }
        .modal-content { display: flex; width: 100%; gap: 40px; }
        .modal-image-sec { flex: 1; overflow-y: auto; }
        .modal-info-sec { width: 400px; padding-top: 60px; }
        .modal-close { position: absolute; top: 40px; right: 40px; cursor: pointer; font-size: 24px; border: none; background: none; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

// ── PRODUCT_TEMPLATE — ADD NEW PRODUCTS HERE ─────────────────────────────────
const mockData = [
  {
    id: 1,
    title: "Signature Camo Essential",
    category: "Lifestyle",
    mediaType: "slides", 
    mediaUrl: "https://res.cloudinary.com/dsviustds/image/upload/v1776947518/Side_1_c8qyfs.png", 
    amazonLink: "https://amzn.to/your-short-link", 
    description: "The debut Whiscraft essential. A heavy-weight, breathable cotton blend crafted for the perfect oversized silhouette.",
    slides: [
      "https://res.cloudinary.com/dsviustds/image/upload/v1776947518/Side_1_c8qyfs.png",
      "https://res.cloudinary.com/dsviustds/image/upload/v1776947517/Side_2_ftdjr3.png",
      "https://res.cloudinary.com/dsviustds/image/upload/v1776947516/Side_3_lelwzf.png"
    ]
  },
  // To add a new product, copy the block above and change the details.
];

const App = () => {
  const [view, setView] = useState('landing'); // 'landing', 'vault', 'account'
  const [selectedProduct, setSelectedProduct] = useState(null);

  const LandingPage = () => (
    <div className="landing-wrap">
      <img src="https://res.cloudinary.com/dsviustds/image/upload/v1776948035/Whiscraft-logo_logo-Dark_1035x267_xanion.png" className="landing-logo" alt="Whiscraft" />
      
      <div className="hero-container">
        <h1 className="tagline">Whiscraft is coming to protect the craft.</h1>
        <button className="cta-btn" onClick={() => setView('account')}>Secure My Spot</button>
      </div>

      <div className="footer-nav">
        <div className="status-pill"><div className="dot"></div> Encryption Protocols Active</div>
        <div className="arrow-circle" onClick={() => setView('vault')}>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </div>
      </div>
    </div>
  );

  const VaultPage = () => (
    <div className="vault-wrap fade-in">
      <div style={{display:'flex', justifyContent:'space-between', marginBottom: '40px'}}>
        <img src="https://res.cloudinary.com/dsviustds/image/upload/v1776948035/Whiscraft-logo_logo-Dark_1035x267_xanion.png" height="24" onClick={() => setView('landing')} style={{cursor:'pointer'}} />
        <button style={{background:'none', border:'none', cursor:'pointer', fontSize:'12px', letterSpacing:'0.1em'}} onClick={() => setView('account')}>ACCOUNT</button>
      </div>
      <h2 style={{fontFamily:'var(--font-display)', fontSize:'48px', fontWeight:'300', marginBottom:'40px'}}>Curated Gear</h2>
      <div className="masonry">
        {mockData.map(item => (
          <div key={item.id} className="card" onClick={() => setSelectedProduct(item)}>
            <img src={item.mediaUrl} alt={item.title} />
            <div className="card-info">
              <div className="card-title">{item.title}</div>
              <div style={{fontSize:'10px', color:'var(--gray-500)', marginTop:'4px'}}>{item.category}</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );

  const AuthPage = () => (
    <div style={{height:'100vh', display:'flex', alignItems:'center', justify_content:'center', padding:'20px'}}>
        <div style={{maxWidth:'360px', width:'100%'}}>
            <h2 style={{fontFamily:'var(--font-display)', fontSize:'32px', marginBottom:'20px'}}>Secure Access</h2>
            <input type="email" placeholder="Email" style={{width:'100%', padding:'12px', border:'1px solid #ddd', marginBottom:'10px'}} />
            <input type="password" placeholder="Password" style={{width:'100%', padding:'12px', border:'1px solid #ddd', marginBottom:'20px'}} />
            <button className="cta-btn" style={{width:'100%'}} onClick={() => setView('landing')}>Create Account</button>
            <button style={{width:'100%', background:'none', border:'none', marginTop:'20px', fontSize:'12px', color:'var(--gray-500)'}} onClick={() => setView('landing')}>BACK TO SITE</button>
        </div>
    </div>
  );

  return (
    <div>
      {view === 'landing' && <LandingPage />}
      {view === 'vault' && <VaultPage />}
      {view === 'account' && <AuthPage />}

      {selectedProduct && (
        <div className="modal-overlay">
          <button className="modal-close" onClick={() => setSelectedProduct(null)}>✕</button>
          <div className="modal-content">
            <div className="modal-image-sec">
                {selectedProduct.slides.map((url, i) => <img key={i} src={url} style={{width:'100%', marginBottom:'20px'}} />)}
            </div>
            <div className="modal-info-sec">
                <span style={{fontSize:'10px', color:'var(--cobalt)', letterSpacing:'0.1em'}}>{selectedProduct.category}</span>
                <h1 style={{fontFamily:'var(--font-display)', fontSize:'42px', margin:'10px 0 20px'}}>{selectedProduct.title}</h1>
                <p style={{lineHeight:'1.6', color:'var(--gray-500)', marginBottom:'30px'}}>{selectedProduct.description}</p>
                
                <a href={selectedProduct.amazonLink} target="_blank" style={{textDecoration:'none'}}>
                    <button className="cta-btn" style={{width:'100%', marginBottom:'12px'}}>Take Me To Product</button>
                </a>
                <button style={{width:'100%', padding:'14px', background:'white', border:'1px solid black', cursor:'pointer', fontSize:'12px', letterSpacing:'0.1em'}}>ADD TO SHOPPING LIST</button>
                
                <div style={{marginTop:'40px', borderTop:'1px solid #eee', paddingTop:'20px'}}>
                    <span style={{fontSize:'11px', fontWeight:'500'}}>FOLDER MANAGEMENT</span>
                    <p style={{fontSize:'12px', color:'#999', marginTop:'8px'}}>Sign in to save this product to a specific project folder.</p>
                </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
